name: Build Android APK

'on':
workflow_dispatch:
push:
paths:
- 'MaGestionCanalPlusAndroid_projet_corrige.zip'
- '.github/workflows/android.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Recuperer le projet
uses: actions/checkout@v4

  - name: Installer Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Installer Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Extraire le projet Android
    run: |
      unzip -o MaGestionCanalPlusAndroid_projet_corrige.zip -d android-project
      find android-project -name build.gradle -type f

  - name: Rechercher le projet Android
    run: |
      find android-project -name settings.gradle -o -name settings.gradle.kts

  - name: Compiler le fichier APK
    run: |
      cd android-project
      gradle assembleDebug

  - name: Publier le fichier APK
    uses: actions/upload-artifact@v4
    with:
      name: Gestion-Canal-Plus-APK
      path: android-project/**/*.apk
      if-no-files-found: error
