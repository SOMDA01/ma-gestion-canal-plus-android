name: Build Android APK

'on':
workflow_dispatch:
push:
paths:
- 'MaGestionCanalPlusAndroid_projet_corrige.zip'
- '.github/workflows/android.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Recuperer le projet
    uses: actions/checkout@v4

  - name: Installer Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Installer Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Extraire le projet Android
    run: |
      unzip -o MaGestionCanalPlusAndroid_projet_corrige.zip -d android-project
      echo "Contenu du projet extrait :"
      find android-project -maxdepth 4 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \)

  - name: Trouver et compiler le projet Android
    run: |
      PROJECT_FILE=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
      if [ -z "$PROJECT_FILE" ]; then
        echo "ERREUR : aucun fichier settings.gradle trouvé."
        echo "Vérifie que le ZIP contient un véritable projet Android."
        exit 1
      fi
      PROJECT_DIR=$(dirname "$PROJECT_FILE")
      echo "Dossier du projet : $PROJECT_DIR"
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Publier le fichier APK
    uses: actions/upload-artifact@v4
    with:
      name: Gestion-Canal-Plus-APK
      path: android-project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
