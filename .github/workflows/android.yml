name: Build Android APK

'on':
workflow_dispatch:
push:
paths:
- 'MaGestionCanalPlusAndroid_projet_corrige.zip'
- '.github/workflows/android.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:  
  - name: Recuperer le projet  
    uses: actions/checkout@v4  

  - name: Installer Java  
    uses: actions/setup-java@v4  
    with:  
      distribution: temurin  
      java-version: '17'  

  - name: Installer Gradle  
    uses: gradle/actions/setup-gradle@v4  
    with:  
      gradle-version: '8.7'  

  - name: Extraire le projet Android  
    run: |  
      unzip -o MaGestionCanalPlusAndroid_projet_corrige.zip -d android-project  
      find android-project -maxdepth 3 -type f  

  - name: Compiler le fichier APK  
    run: |  
      cd android-project  
      find . -name build.gradle -type f  

- name: Rechercher le fichier APK
  run: |
  echo "Recherche des fichiers APK générés :"
  find android-project -type f -name "*.apk" -print
  
  - name: Publier le fichier APK
  uses: actions/upload-artifact@v4
  with:
    name: Gestion-Canal-Plus-APK
    path: android-project/**/*.apk
    if-no-files-found: error
