
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -o "gestion canal.zip" -d android-project
          find android-project -name gradlew -type f

      - name: Build APK
        run: |
          cd android-project
          WRAPPER="$(find . -name gradlew -type f -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "Fichier gradlew introuvable dans le ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Canal-Plus-APK
          path: android-project/**/*.apk
