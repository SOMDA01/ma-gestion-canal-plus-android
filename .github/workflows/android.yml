name: Build Android APK

on:
workflow_dispatch:
push:
paths:
- 'MaGestionCanalPlusAndroid_projet_corrige.zip'
- '.github/workflows/android.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Recuperer le projet
    uses: actions/checkout@v4

  - name: Installer Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Installer Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Extraire le projet Android
    run: |
      mkdir -p android-project
      unzip -o MaGestionCanalPlusAndroid_projet_corrige.zip -d android-project
      echo "Fichiers du projet :"
      find android-project -maxdepth 5 -type f | head -200

  - name: Rechercher le projet Gradle
    id: find_project
    shell: bash
    run: |
      SETTINGS_FILE="$(find android-project -type f -name settings.gradle -o -name settings.gradle.kts -print -quit)"

      if [ -z "$SETTINGS_FILE" ]; then
        echo "ERREUR : aucun fichier settings.gradle trouvé dans le ZIP."
        exit 1
      fi

      PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
      echo "Projet Gradle trouvé : $PROJECT_DIR"
      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

  - name: Compiler le fichier APK
    run: |
      gradle -p "${{ steps.find_project.outputs.project_dir }}" assembleDebug

  - name: Rechercher et publier le fichier APK
    uses: actions/upload-artifact@v4
    with:
      name: Gestion-Canal-Plus-APK
      path: android-project/**/*.apk
      if-no-files-found: error
